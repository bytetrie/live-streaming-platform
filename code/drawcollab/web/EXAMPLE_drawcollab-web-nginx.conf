server {
    listen 80;
    server_name drawcollab.local;
    root /path/to/your/code/directory/drawcollab/web;

    location /socket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        proxy_pass http://127.0.0.1:1337;
    }

    location / {
        try_files /interface/index.html =404;
    }

    location ~* \.(js|css)$ {
        try_files /interface/static/$uri =404;
    }
}